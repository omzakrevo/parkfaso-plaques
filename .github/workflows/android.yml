name: APK Android

# Compile l'APK à chaque modification de main (ou à la demande depuis l'onglet
# Actions), puis le publie dans la Release « derniere-version ».
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: apk-android
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - uses: subosito/flutter-action@v2
        with:
          channel: stable
          flutter-version: 3.47.7
          cache: true

      - name: Dépendances
        run: flutter pub get

      - name: Analyse du code
        run: flutter analyze

      - name: Tests
        run: flutter test

      - name: APK universel (tous les téléphones)
        run: flutter build apk --release --build-number=${{ github.run_number }}

      - name: APK légers (par processeur)
        run: flutter build apk --release --split-per-abi --build-number=${{ github.run_number }}

      - name: Renommer les APK
        run: |
          mkdir -p dist
          cp build/app/outputs/flutter-apk/app-release.apk dist/PARKFASO.apk
          cp build/app/outputs/flutter-apk/app-arm64-v8a-release.apk dist/PARKFASO-arm64.apk
          cp build/app/outputs/flutter-apk/app-armeabi-v7a-release.apk dist/PARKFASO-arm32.apk
          ls -lh dist

      - name: Garder les APK (onglet Actions)
        uses: actions/upload-artifact@v4
        with:
          name: PARKFASO-apk-${{ github.run_number }}
          path: dist/*.apk
          retention-days: 30

      - name: Publier dans la Release « derniere-version »
        uses: softprops/action-gh-release@v2
        with:
          tag_name: derniere-version
          name: PARKFASO — dernière version (build ${{ github.run_number }})
          make_latest: true
          prerelease: false
          body: |
            APK compilé automatiquement depuis le commit ${{ github.sha }}.

            - **PARKFASO.apk** : universel, fonctionne sur tous les téléphones Android (recommandé).
            - **PARKFASO-arm64.apk** : plus léger, téléphones récents (64 bits).
            - **PARKFASO-arm32.apk** : plus léger, téléphones 32 bits.

            Installation : téléchargez l'APK sur le téléphone, ouvrez-le, autorisez
            « Installer des applications inconnues » si Android le demande.
          files: dist/*.apk

      - name: Déplacer l'étiquette sur ce commit
        run: |
          git tag -f derniere-version
          git push -f origin derniere-version
